name: "🔧 Infrastructure"
description: 인프라/환경/빌드/관측성 설정 작업
title: "[Infra] "
labels: ["type:infra"]
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 무엇을 설정/변경하는가?
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 / 필요성
      description: 어떤 문제 때문에 필요한가 (기술 도입을 위한 문제 만들기가 아니어야 함)
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 설계 방향 (논의 결과)
      description: 대안 비교와 선택 이유. 중요한 결정이면 docs/adr/에 ADR로 별도 기록
    validations:
      required: false

  - type: textarea
    id: dod
    attributes:
      label: 완료 조건 (Definition of Done)
      placeholder: |
        - [ ] 조건 1
        - [ ] 조건 2
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 어떻게 동작을 확인할 것인가 (예: curl 요청, 대시보드 확인 등)
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 위험 / 롤백 계획
      description: 운영 중인 시스템에 영향이 있다면 롤백 방법
    validations:
      required: false
