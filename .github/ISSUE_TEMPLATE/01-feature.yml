name: "✨ Feature"
description: 새로운 기능 또는 모듈 구현 제안
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 / 목적
      description: 이 기능이 왜 필요한가? 어떤 문제를 해결하는가?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 체크리스트 형태로 작성
      placeholder: |
        - [ ] 요구사항 1
        - [ ] 요구사항 2
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 설계 방향 (논의 결과)
      description: 검토한 대안과 선택 이유. 설계 논의 내용을 요약해서 기록
    validations:
      required: false

  - type: textarea
    id: dod
    attributes:
      label: 완료 조건 (Definition of Done)
      placeholder: |
        - [ ] 조건 1
        - [ ] 조건 2
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위 (Out of Scope)
      description: 이번 작업에서 다루지 않는 것을 명시해 스코프 확대를 방지
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: 관련 Issue / ADR
      placeholder: "#, docs/adr/..."
    validations:
      required: false
