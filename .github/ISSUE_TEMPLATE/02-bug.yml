name: "🐛 Bug Report"
description: 버그 리포트
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 증상
      description: 무엇이 잘못되었는가?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 (에러 로그 포함)
      render: shell
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: 커밋 / 브랜치
      placeholder: "예: 70d5840 / master"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 실행 환경
      options:
        - 로컬 (IntelliJ)
        - Docker Compose
        - CI
        - 기타
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: 원인 분석 (파악된 경우)
    validations:
      required: false
