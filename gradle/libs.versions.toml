# Libraries managed by the Spring Boot or Spring Modulith BOM have no version here.
# The BOM decides the actual version. Only plugins, BOMs, libraries outside the BOMs,
# and tool versions are pinned in this file.

[versions]
kotlin = "2.3.21"
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
springModulith = "2.1.1"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }

spring-boot-starterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starterDataJpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starterFlyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starterWebmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starterRestclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-dockerCompose = { module = "org.springframework.boot:spring-boot-docker-compose" }
spring-boot-starterActuatorTest = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-starterDataJpaTest = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starterFlywayTest = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-boot-starterWebmvcTest = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starterRestclientTest = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

spring-modulith-starterCore = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starterInsight = { module = "org.springframework.modulith:spring-modulith-starter-insight" }
spring-modulith-starterJpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-starterTest = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-runtime = { module = "org.springframework.modulith:spring-modulith-runtime" }

flyway-databasePostgresql = { module = "org.flywaydb:flyway-database-postgresql" }
jackson-moduleKotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-testJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
micrometer-registryPrometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
postgresql = { module = "org.postgresql:postgresql" }
reactor-nettyHttp = { module = "io.projectreactor.netty:reactor-netty-http" }
testcontainers-junitJupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
