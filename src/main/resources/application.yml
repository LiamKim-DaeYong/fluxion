spring:
  application:
    name: fluxion
  jpa:
    open-in-view: false
  modulith:
    runtime:
      flyway-enabled: true
    events:
      # Completed publications are deleted; the trade table already keeps every stored trade (#35).
      completion-mode: delete
      # Publications left incomplete by a failed listener are sent again when the application restarts.
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
